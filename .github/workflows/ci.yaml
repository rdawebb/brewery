name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})${{ matrix.check && ' + check' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.11", "3.14"]
        include:
          - { os: macos-latest, python-version: "3.12", check: true }
          - { os: macos-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install patchelf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Lint, format, type & layer check
        if: matrix.check
        run: uv run just check

      - name: Fail on uncommitted formatting changes
        if: matrix.check
        run: git diff --exit-code

      - name: Test
        run: uv run just test-all
