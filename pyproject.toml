[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project]
name = "brewery"
version = "0.4.0"
description = "Fast Homebrew Package Manager"
authors = [{name = "Rob Webb"}]
requires-python = ">=3.11"
license = "MIT AND BSD-2-Clause"
license-files = ["LICENSE", "LICENSE-HOMEBREW"]
keywords = [
    "homebrew",
    "brew",
    "package-manager",
    "formula",
    "cask",
    "macos",
    "linux",
    "command-line",
    "cli",
    "terminal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
    "Topic :: Utilities",
]
dependencies = [
  "httpx[brotli,zstd]>=0.28.0,<1.0.0",
  "orjson>=3.12.0,<4.0.0",
  "pygments>=2.20.0",
  "readchar>=4.0.0,<5.0.0",
  "rich>=15.0.0,<16.0.0",
  "typer-extensions>=0.3.0,<1.0.0",
  "zstandard>=0.25.0,<1.0.0"
]

[project.scripts]
brewery = "brewery.cli.main:main"
br = "brewery.cli.main:main"

[project.optional-dependencies]
dev = [
  "icecream>=2.2.0,<3.0.0",
  "import-linter>=2.3,<3.0.0",
  "prek>=0.4.14,<1.0.0",
  "pytest>=9.0.3,<10.0.0",
  "pytest-asyncio>=1.4.0,<2.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "ruff==0.16.0", # Pinned to avoid surprise default rule set changes
  "rust-just>=1.58.0,<2.0.0",
  "ty>=0.0.72,<1.0.0"
]

[project.urls]
Repository = "https://github.com/rdawebb/brewery"
Changelog = "https://github.com/rdawebb/brewery/blob/main/CHANGELOG.md"

[tool.uv.build-backend]
module-name = "brewery"

[tool.importlinter]
root_packages = ["brewery"]

# One-way layering rule: a package may import anything below it, never above
[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
containers = ["brewery"]
layers = [
  "cli",
  "daemon",
  "services",
  "providers",
  "core",
]
exhaustive = true
exhaustive_ignores = ["scripts"]

# Repository is a data facade for the layers above it; providers build on the
# core primitives directly
[[tool.importlinter.contracts]]
name = "Providers use core primitives, not the Repository facade"
type = "forbidden"
source_modules = ["brewery.providers"]
forbidden_modules = ["brewery.core.repo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true
# Applied by directory in tests/conftest.py, unless an explicit marker on a test
markers = [
  "unit: fast isolated tests with no subprocess or network",
  "integration: tests that exercise the provider pipeline against fixtures",
]

[tool.coverage.run]
source = ["src/brewery"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@overload",
]
